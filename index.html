<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SafeCheck Daily | Build v35</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; max-width: 600px; margin: auto; }
        .screen { display: none; }
        input, button, select { display: block; width: 100%; margin: 10px 0; padding: 12px; border-radius: 8px; border: 1px solid #ccc; }
        .link-text { color: #007bff; text-decoration: underline; cursor: pointer; text-align: center; }
    </style>
</head>
<body>

    <div id="landing-screen" class="screen" style="display: block;">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email">
        <input type="password" id="login-password" placeholder="Password">
        <button id="login-btn" style="background: #007bff; color: white;">Login</button>
        <p class="link-text" id="go-to-reg-btn">Register</p>
    </div>

    <div id="register-screen" class="screen">
        <h2>Register</h2>
        <input type="text" id="reg-name" placeholder="Name">
        <input type="email" id="reg-email" placeholder="Email">
        <input type="time" id="reg-time">
        <input type="tel" id="reg-mobile" placeholder="Mobile">
        <input type="password" id="reg-password" placeholder="Password">
        <h3>Nominee Details</h3>
        <input type="text" id="reg-nom-name" placeholder="Nominee Name">
        <input type="tel" id="reg-nom-mobile" placeholder="Nominee Mobile">
        <input type="email" id="reg-nom-email" placeholder="Nominee Email">
        <button id="submit-reg-btn" style="background: #28a745; color: white;">Register</button>
        <p class="link-text" id="back-to-login">Back to Login</p>
    </div>

    <div id="dashboard-screen" class="screen">
        <h2>SafeCheck Daily</h2>
        <p id="system-status">Monitoring</p>
        <button id="ok-btn" style="background: green; color: white; padding: 30px;">I'm OK</button>
        <p>Check in time: <span id="display-time">--:--</span></p>
        <button id="go-to-amend-nom-btn" style="background: #6c757d; color: white;">Amend Nominee Details</button>
        <button id="go-to-amend-user-btn" style="background: #6c757d; color: white;">Amend Your Details</button>
        <button id="logout-btn" style="background: #dc3545; color: white;">Log Out</button>
    </div>

    <div id="amend-user-screen" class="screen">
        <h2>Amend Your Details</h2>
        <input type="text" id="edit-name" placeholder="New Name">
        <input type="time" id="edit-time">
        <input type="tel" id="edit-mobile" placeholder="New Mobile">
        <button id="save-user-btn" style="background: #28a745; color: white;">Save User Changes</button>
        <p class="link-text" id="back-to-dashboard-1">Back</p>
    </div>

    <div id="amend-nom-screen" class="screen">
        <h2>Amend Nominee Details</h2>
        <input type="text" id="edit-nom-name" placeholder="New Nominee Name">
        <input type="tel" id="edit-nom-mobile" placeholder="New Nominee Mobile">
        <input type="email" id="edit-nom-email" placeholder="New Nominee Email">
        <button id="save-nom-btn" style="background: #28a745; color: white;">Save Nominee Changes</button>
        <p class="link-text" id="back-to-dashboard-2">Back</p>
    </div>

    <script type="module" src="backend.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
